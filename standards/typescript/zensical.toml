[project]
site_name = "TypeScript - Gold Standard"
site_description = "The gold-standard cross-cutting TypeScript rubric VibeCode QA judges across browser apps, Workers, APIs, CLIs, SDKs, extensions, desktop apps, and CI boundaries."
site_author = "VibeCode QA"
site_url = "https://vibecodeqa.online/standards/typescript/"
repo_url = "https://github.com/vibecodeqa/vibecodeqa"
repo_name = "vibecodeqa/vibecodeqa"
copyright = "The TypeScript gold standard - the rubric VibeCode QA judges against."

docs_dir = "docs"
site_dir = "site"

nav = [
  { "Overview" = "index.md" },
  { "Edition v1" = [
    { "About this edition" = "v1/index.md" },
    { "1 - Config and strictness" = "v1/config-and-strictness.md" },
    { "2 - Runtime and modules" = "v1/runtime-and-modules.md" },
    { "3 - Project structure" = "v1/project-structure.md" },
    { "4 - Unsafe types and suppressions" = "v1/unsafe-types-and-suppressions.md" },
    { "5 - Boundary typing and validation" = "v1/boundary-typing-and-validation.md" },
    { "6 - Imports and emit" = "v1/imports-and-emit.md" },
    { "7 - Generated code and exceptions" = "v1/generated-code-and-exceptions.md" },
    { "8 - Declarations and public API" = "v1/declarations-and-public-api.md" },
    { "9 - CI and evidence" = "v1/ci-and-evidence.md" }
  ] }
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight"
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
