[project]
site_name = "Flutter Firebase App - Gold Standard"
site_description = "The gold-standard reference for Flutter workspaces backed by Firebase: Melos app/admin/shared packages, environment separation, Firestore rules and indexes, Cloud Functions trust boundaries, platform build evidence, and deploy gates."
site_author = "VibeCode QA"
site_url = "https://vibecodeqa.online/standards/flutter-firebase-app/"
repo_url = "https://github.com/vibecodeqa/vibecodeqa"
repo_name = "vibecodeqa/vibecodeqa"
copyright = "The flutter-firebase-app gold standard - the rubric VibeCode QA judges against."

docs_dir = "docs"
site_dir = "site"

nav = [
  { "Overview" = "index.md" },
  { "Edition v1" = [
    { "About this edition" = "v1/index.md" },
    { "1 - Workspace shape and orchestration" = "v1/workspace-and-packages.md" },
    { "2 - Firebase environments and configuration" = "v1/firebase-environments.md" },
    { "3 - Client config versus server secrets" = "v1/client-config-and-secrets.md" },
    { "4 - Firestore rules and indexes" = "v1/firestore-rules-and-indexes.md" },
    { "5 - Trusted server boundaries" = "v1/trusted-server-boundaries.md" },
    { "6 - Platform builds and deploy gates" = "v1/builds-and-deploy-gates.md" }
  ] }
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight"
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
