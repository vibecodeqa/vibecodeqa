<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="VibeCode QA — code health scanner for the AI coding era">
  <title>VibeCode QA — Code Health Scanner for the AI Coding Era</title>

  <defs>
    <!-- Site accent gradient: var(accent) #818cf8 to the hero #a78bfa -->
    <linearGradient id="accentText" gradientUnits="userSpaceOnUse" x1="72" y1="180" x2="560" y2="250">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="markFill" gradientUnits="userSpaceOnUse" x1="72" y1="64" x2="128" y2="120">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="240" cy="120" r="620">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#6366f1" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1e1e24" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Canvas: var(bg) -->
  <rect width="1200" height="630" fill="#09090b"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Left column -->

  <!-- Square mark, matching favicon.svg geometry (32x32 rx6, scaled 1.75x) -->
  <rect x="72" y="64" width="56" height="56" rx="11" fill="url(#markFill)"/>
  <text x="100" y="103" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff">VQ</text>
  <text x="146" y="102" font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#6b7280" letter-spacing="0.5">vibecodeqa.online</text>

  <!-- Headline -->
  <text x="72" y="238" font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="78" font-weight="900" letter-spacing="-3">
    <tspan fill="url(#accentText)">VibeCode</tspan><tspan fill="#e5e5e5" dx="24">QA</tspan>
  </text>

  <!-- Subhead -->
  <text x="72" y="292" font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#b0b0ba">Code health scanner for the AI coding era</text>

  <!-- Install command -->
  <rect x="72" y="336" width="424" height="66" rx="12" fill="#111115" stroke="#1e1e24" stroke-width="1"/>
  <text x="100" y="378" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="500" fill="#818cf8">npx @vibecodeqa/cli</text>

  <!-- Stat row -->
  <g font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="492" font-size="48" font-weight="900" fill="#818cf8">34</text>
    <text x="72" y="524" font-size="19" font-weight="600" fill="#6b7280" letter-spacing="1.4">CHECKS</text>

    <text x="240" y="492" font-size="48" font-weight="900" fill="#818cf8">0</text>
    <text x="240" y="524" font-size="19" font-weight="600" fill="#6b7280" letter-spacing="1.4">CONFIG</text>

    <text x="384" y="492" font-size="48" font-weight="900" fill="#818cf8">5s</text>
    <text x="384" y="524" font-size="19" font-weight="600" fill="#6b7280" letter-spacing="1.4">REPORT</text>
  </g>

  <!-- Right column: report card -->

  <g>
    <rect x="664" y="96" width="464" height="438" rx="20" fill="#111115" stroke="#1e1e24" stroke-width="2"/>

    <!-- Card header -->
    <text x="696" y="150" font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#6b7280" letter-spacing="1.6">CODE HEALTH</text>
    <text x="1096" y="156" text-anchor="end" font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#22c55e">87</text>
    <line x1="696" y1="182" x2="1096" y2="182" stroke="#1e1e24" stroke-width="2"/>

    <!-- Check rows: dot + label + score bar -->
    <g font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="600">
      <g>
        <circle cx="706" cy="226" r="8" fill="#22c55e"/>
        <text x="730" y="234" fill="#e5e5e5">Lint</text>
        <rect x="912" y="220" width="184" height="10" rx="5" fill="#1e1e24"/>
        <rect x="912" y="220" width="172" height="10" rx="5" fill="#22c55e"/>
      </g>
      <g>
        <circle cx="706" cy="282" r="8" fill="#22c55e"/>
        <text x="730" y="290" fill="#e5e5e5">Types</text>
        <rect x="912" y="276" width="184" height="10" rx="5" fill="#1e1e24"/>
        <rect x="912" y="276" width="160" height="10" rx="5" fill="#22c55e"/>
      </g>
      <g>
        <circle cx="706" cy="338" r="8" fill="#eab308"/>
        <text x="730" y="346" fill="#e5e5e5">Complexity</text>
        <rect x="912" y="332" width="184" height="10" rx="5" fill="#1e1e24"/>
        <rect x="912" y="332" width="112" height="10" rx="5" fill="#eab308"/>
      </g>
      <g>
        <circle cx="706" cy="394" r="8" fill="#22c55e"/>
        <text x="730" y="402" fill="#e5e5e5">Security</text>
        <rect x="912" y="388" width="184" height="10" rx="5" fill="#1e1e24"/>
        <rect x="912" y="388" width="176" height="10" rx="5" fill="#22c55e"/>
      </g>
      <g>
        <circle cx="706" cy="450" r="8" fill="#eab308"/>
        <text x="730" y="458" fill="#e5e5e5">Architecture</text>
        <rect x="912" y="444" width="184" height="10" rx="5" fill="#1e1e24"/>
        <rect x="912" y="444" width="128" height="10" rx="5" fill="#eab308"/>
      </g>
      <g>
        <circle cx="706" cy="506" r="8" fill="#ef4444"/>
        <text x="730" y="514" fill="#e5e5e5">Testing</text>
        <rect x="912" y="500" width="184" height="10" rx="5" fill="#1e1e24"/>
        <rect x="912" y="500" width="62" height="10" rx="5" fill="#ef4444"/>
      </g>
    </g>
  </g>
</svg>
